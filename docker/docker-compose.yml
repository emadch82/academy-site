version: '3.8'

# Docker Compose تولید - سامانه آموزشگاه هوشمند
# اجرا: docker compose -f docker/docker-compose.yml up -d

services:
  # ── MongoDB ──────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: amozesh-mongodb-prod
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USERNAME:-amozesh}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:-amozesh_pass}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    command: mongod --auth
    networks:
      - amozesh-network

  # ── MinIO (S3-compatible storage) ────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: amozesh-minio-prod
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-amozesh_minio_access}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-amozesh_minio_secret_key}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - amozesh-network

  # ── Redis (برای Caching و Session) ─────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: amozesh-redis-prod
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-amozesh_redis_pass}
    volumes:
      - redis_data:/data
    networks:
      - amozesh-network

  # ── API Backend ─────────────────────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: amozesh-api-prod
    restart: always
    ports:
      - "8000:8000"
    environment:
      NODE_ENV: production
      PORT: 8000
      MONGODB_URI: mongodb://${MONGODB_USERNAME:-amozesh}:${MONGODB_PASSWORD:-amozesh_pass}@mongodb:27017/amozesh?authSource=admin
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      COOKIE_SECRET: ${COOKIE_SECRET}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-localhost}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-amozesh_minio_access}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-amozesh_minio_secret_key}
      S3_BUCKET: ${S3_BUCKET:-amozesh}
      REDIS_URL: redis://:${REDIS_PASSWORD:-amozesh_redis_pass}@redis:6379
    depends_on:
      - mongodb
      - minio
      - redis
    networks:
      - amozesh-network

  # ── Frontend ────────────────────────────────────────────────────────────
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: amozesh-web-prod
    restart: always
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:8000}
      NEXT_PUBLIC_APP_URL: ${APP_URL:-http://localhost:8080}
    depends_on:
      - api
    networks:
      - amozesh-network

  # ── Nginx (Reverse Proxy) ──────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: amozesh-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - web
    networks:
      - amozesh-network

volumes:
  mongodb_data:
  mongodb_config:
  minio_data:
  redis_data:

networks:
  amozesh-network:
    driver: bridge
